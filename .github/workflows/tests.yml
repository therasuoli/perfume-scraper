name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project in isolated environment
        run: python -m venv .venv && .venv/bin/python -m pip install --upgrade pip && .venv/bin/python -m pip install -e ".[dev]" && .venv/bin/python -m pip check
      - name: Print runtime
        run: python --version && .venv/bin/python -m pip --version && .venv/bin/python -m pytest --version
      - name: Run tests with diagnostics
        run: .venv/bin/python -m pytest -vv --tb=long
      - name: Verify CLI help
        run: .venv/bin/perfume-scraper --help
